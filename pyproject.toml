[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-skill-router"
version = "0.1.0"
description = "Local-first, platform-neutral routing and activation for Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Universal Skill Router contributors"}]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3"]

[project.scripts]
skillrouter = "skillrouter.cli:main"

[tool.setuptools.packages.find]
include = ["skillrouter*"]
